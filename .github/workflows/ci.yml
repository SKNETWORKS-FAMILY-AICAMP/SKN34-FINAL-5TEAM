# CI: PR을 올리거나 main에 push할 때마다 백엔드 테스트 + 프론트 빌드를 자동으로 돌린다.
name: CI

on:
  pull_request:          # PR을 올리거나 갱신할 때
  push:
    branches: [main]     # main에 합쳐진 직후에도 한 번 더 확인

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # backend/Dockerfile 과 동일
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # 테스트는 DB를 가짜(_FakeDB)로 대체하므로 Postgres·Ollama 없이 돈다.
      - run: python -m pytest tests -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: "false"   # true면 eslint 경고도 빌드 실패로 처리됨 → 처음엔 꺼두고 나중에 켠다
