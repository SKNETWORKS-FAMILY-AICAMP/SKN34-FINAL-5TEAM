version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cheongyak
      POSTGRES_PASSWORD: cheongyak
      POSTGRES_DB: cheongyak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://cheongyak:cheongyak@db:5432/cheongyak
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8000
      # Windows에서 코드를 저장해도 화면이 안 바뀌는 문제: 파일 변경을 주기적으로 확인하게 한다
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
