<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>청약돼?! · 첫 페이지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700&amp;family=Jua&amp;display=swap">
<style>
h1{font-family:'Jua','Gothic A1',sans-serif !important;font-weight:400 !important;letter-spacing:0 !important}
button,input,textarea{font-family:inherit}
body{margin:0;background:#5FB8DC}
a{color:#1D4FB8}a:hover{color:#0A2B5E}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
.hero-bg{position:relative;background-color:#5FB8DC;background-image:url(__MOCKUP__/img/sky.jpg);background-size:cover;background-position:center bottom}
.hero-bg::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,30,60,0.26) 0%,rgba(6,30,60,0.04) 28%,rgba(6,30,60,0) 60%,rgba(6,30,60,0.42) 100%);pointer-events:none}
.glass{background:rgba(255,255,255,0.9);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2)}
.glass-dark{background:rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
</style>
</helmet>
<div class="hero-bg" style="font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #14213A; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; font-size: 15px; line-height: 1.5">

<!-- 상단 메뉴: 다른 화면과 같은 투명 헤더 -->
<header style="position: relative; z-index: 1">
<div style="max-width: 1240px; margin: 0 auto; padding: 0 24px; min-height: 68px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px">
<a href="Landing.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M6 19 20 7l14 12v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round"></path><circle cx="14" cy="26" r="2.8" fill="#7FB0FF"></circle><circle cx="20" cy="26" r="2.8" fill="#5FD3A8"></circle><circle cx="26" cy="26" r="2.8" fill="#FF9B6A"></circle></svg>
<span style="font-family: 'Jua', 'Gothic A1', sans-serif; font-size: 30px; font-weight: 400; letter-spacing: 0; white-space: nowrap">청약돼<span style="display: inline-block; margin-left: 4px; padding: 3px 7px 4px; border-radius: 10px 10px 10px 3px; background: #FF6B4A; color: #FFFFFF; font-size: 19px; line-height: 1; vertical-align: 4px">?!</span></span>
</a>
<nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; font-size: 14px">
<a href="Home.dc.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; color: #0A1A33; text-decoration: none; font-weight: 700">로그인</a>
</nav>
</div>
</header>

<main style="position: relative; z-index: 1; flex: 1; width: 100%; margin: 0; padding: 4px 0 16px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 2.6vh, 26px); text-align: center">

<!-- ① 제목 -->
<div style="max-width: 1240px; padding: 0 24px; box-sizing: border-box; color: #FFFFFF; text-shadow: 0 2px 18px rgba(6, 22, 48, 0.35)">
<span class="glass-dark" style="display: inline-block; font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.45); text-shadow: none">청약홈 · LH · SH 공고 기반 AI 청약 진단</span>
<h1 style="margin: 12px 0 6px; font-size: clamp(32px, 5.2vh, 50px); line-height: 1.2">1분 진단으로 당첨 가능한 공고와 전략까지</h1>
<p style="margin: 0; font-size: 16px; color: #EAF2FF">가점·1순위·특별공급 자격을 진단하고, AI가 공고문을 읽어 내게 맞는 공고와 자금 계획까지 정리해 드려요</p>
</div>

<!-- ② 기능 화면 슬라이드: 왼쪽 화면(꽉 차게) · 오른쪽 설명 -->
<section aria-roledescription="carousel" aria-label="기능 화면 미리보기" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="width: 100%; display: grid; background: rgba(255, 255, 255, 0.16); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); overflow: hidden; text-align: left">
<sc-for list="{{slides}}" as="s" hint-placeholder-count="3">
<div role="group" aria-roledescription="slide" aria-label="{{s.aria}}" aria-hidden="{{s.hidden}}" style="{{s.style}}">
<div style="min-width: 0; display: flex; justify-content: flex-end; padding-right: clamp(20px, 2.6vw, 40px)">
<img src="{{s.img}}" alt="{{s.alt}}" style="display: block; height: clamp(210px, 37vh, 360px); width: auto; max-width: 100%; object-fit: contain; object-position: right center; filter: drop-shadow(0 16px 30px rgba(6, 22, 48, 0.3))">
</div>
<div style="min-width: 0; display: flex; align-items: stretch">
<div aria-hidden="true" style="flex: none; width: 3px; border-radius: 99px; background: rgba(255, 255, 255, 0.85); box-shadow: 0 0 12px rgba(6, 22, 48, 0.25)"></div>
<div style="flex: 0 1 440px; min-width: 0; margin-left: clamp(20px, 2.6vw, 40px); border-radius: 20px; background: rgba(226, 240, 251, 0.9); border: 1px solid rgba(255, 255, 255, 0.8); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); box-shadow: 0 16px 40px rgba(6, 22, 48, 0.2); padding: clamp(18px, 3vh, 30px) clamp(20px, 2vw, 30px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; color: #0A2B5E">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: #1D4FB8"><span style="width: 30px; height: 30px; border-radius: 9px; background: #1D5BD8; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center">{{s.no}}</span>STEP {{s.no}} / 3</span>
<span style="font-family: 'Jua', 'Gothic A1', sans-serif; font-size: clamp(25px, 3.8vh, 34px); line-height: 1.25">{{s.title}}</span>
<span style="font-size: 15px; color: #2A3445; line-height: 1.65">{{s.desc}}</span>
<span style="display: inline-flex; align-items: center; justify-content: center; min-height: 30px; box-sizing: border-box; line-height: 1; margin-top: 4px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D6D0F5; color: #4A2FC0; font-size: 12.5px; font-weight: 700">{{s.tag}}</span>
</div>
</div>
</div>
</sc-for>
</div>
<div role="group" aria-label="슬라이드 선택" style="display: flex; gap: 2px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
<button type="button" aria-label="{{d.aria}}" aria-current="{{d.current}}" onClick="{{d.pick}}" style="width: 36px; height: 28px; padding: 0; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><span style="{{d.style}}"></span></button>
</sc-for>
</div>
</section>

<!-- ③ 시작 버튼 (하나만) -->
<div style="padding: 0 24px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<a href="Home.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 56px; min-width: 260px; padding: 0 32px; border-radius: 14px; background: #1D5BD8; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; box-shadow: 0 14px 30px rgba(6, 22, 48, 0.3)">청약 진단 시작하기</a>
<span style="font-size: 13px; color: #FFFFFF; text-shadow: 0 1px 8px rgba(6, 22, 48, 0.5)">회원가입 없이 시작 · 결과를 저장할 때만 로그인</span>
</div>
</main>

<footer style="position: relative; z-index: 1; padding: 0 24px 12px; text-align: center; font-size: 12px; color: rgba(255, 255, 255, 0.88)">진단 결과는 참고용이며, 실제 자격은 각 입주자모집공고문 기준으로 확인하세요 · 데이터: 청약홈 · LH · SH</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seconds":{"editor":"int","default":4,"min":2,"max":10,"unit":"초"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  componentDidMount() { this.start(); }
  componentWillUnmount() { clearInterval(this.timer); }
  start() {
    clearInterval(this.timer);
    const ms = (this.props.seconds ?? 4) * 1000;
    this.timer = setInterval(() => this.setState((s) => ({ i: (s.i + 1) % 3 })), ms);
  }
  go(n) { this.setState({ i: n }); this.start(); }
  renderVals() {
    const items = [
      { no: '1', title: '단계별 청약 진단', desc: '나이 · 주택 · 가족 · 통장 · 소득 · 희망 조건 6단계에 버튼으로 답하면, 오른쪽 막대에 가점이 차곡차곡 쌓여요.', tag: '가점 자동 계산 · 회원가입 없이', img: '__MOCKUP__/img/slide-diagnosis.png', pos: 'left top' },
      { no: '2', title: '진단 결과 미리보기', desc: '예상 가점과 1순위 요건, 특별공급 자격을 한눈에 확인하고, AI가 고른 내 조건에 맞는 공고 1건을 먼저 봐요.', tag: 'AI 공고 판정 1건 무료', img: '__MOCKUP__/img/slide-result.png', pos: 'left top' },
      { no: '3', title: '로그인 후 맞춤 대시보드', desc: '추천 공고와 자금 · 출퇴근 조건을 함께 보고, 공고문 근거 AI 상담과 전략 리포트까지 이어져요.', tag: 'RAG 상담 · 멀티 에이전트 리포트', img: '__MOCKUP__/img/slide-dashboard.png', pos: 'left top' }
    ];
    const cur = this.state.i;
    const slides = items.map((it, k) => Object.assign({}, it, {
      alt: it.title + ' 화면 예시', aria: (k + 1) + ' / 3 · ' + it.title, hidden: k === cur ? 'false' : 'true',
      imgStyle: 'display: block; width: 100%; height: clamp(240px, 43vh, 420px); box-sizing: border-box; padding: clamp(14px, 2.4vh, 24px) clamp(16px, 2vw, 32px); object-fit: contain; object-position: center; filter: drop-shadow(0 16px 30px rgba(6, 22, 48, 0.28))',
      style: 'grid-area: 1 / 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; padding: clamp(16px, 2.6vh, 26px) 24px; transition: opacity 0.6s ease; opacity: ' + (k === cur ? '1' : '0') + '; pointer-events: ' + (k === cur ? 'auto' : 'none') + ';'
    }));
    const dots = items.map((it, k) => ({
      aria: (k + 1) + '번 화면 보기 · ' + it.title, current: k === cur ? 'true' : 'false', pick: () => this.go(k),
      style: 'display: block; height: 10px; border-radius: 99px; box-shadow: 0 1px 6px rgba(6, 22, 48, 0.3); transition: width 0.3s ease, background 0.3s ease; ' + (k === cur ? 'width: 26px; background: #FFFFFF;' : 'width: 10px; background: rgba(255, 255, 255, 0.5);')
    }));
    return { slides, dots };
  }
}
</script>
</body>
</html>
